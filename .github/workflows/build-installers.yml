# 云端构建全平台安装包:
# - macOS: dmg(Apple 芯片 + Intel)
# - Windows: NSIS 安装包 (exe)
# - Linux: AppImage
# - Android: APK(通过 server_url 参数指定要连接的服务器地址)
#
# 使用方式:
# 1. GitHub 仓库页面 → Actions → Build installers → Run workflow
# 2. 若安卓用户要连你的服务器,在 server_url 填入你的地址,如 http://192.168.1.100:3001
# 3. 构建完成后,安装包会自动上传到名为「安装包下载」的 Release

name: Build installers

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: '安卓 APK 要连接的服务器地址(桌面版不受此影响)'
        required: false
        default: 'http://127.0.0.1:3001'
  push:
    tags: ['v*']

permissions:
  contents: write   # 允许流水线创建/更新 Release

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            flag: --mac --arm64 --x64
            files: |
              release/*.dmg
          - os: windows-latest
            flag: --win --x64
            files: |
              release/*.exe
          - os: ubuntu-latest
            flag: --linux --x64
            files: |
              release/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 构建前端
        run: npm run build
      - name: 打包桌面安装包
        run: npx electron-builder ${{ matrix.flag }} --publish never
      - name: 上传到「安装包下载」Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: installers
          name: 安装包下载
          body: |
            棋聚一堂各平台安装包(每次构建自动更新)。
            - macOS:双击 dmg 拖入 Applications(Apple 芯片用 -arm64,Intel 用另一个)
            - Windows:运行 Setup exe 安装
            - Linux:chmod +x *.AppImage 后双击运行
            - Android:见安卓构建任务产出的 APK(需先配置服务器地址)
          files: ${{ matrix.files }}
          generate_release_notes: false

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: 安装依赖
        run: npm ci
      - name: 构建前端
        run: npm run build
      - name: 写入服务器地址
        env:
          SERVER_URL: ${{ github.event.inputs.server_url || 'http://127.0.0.1:3001' }}
        run: |
          node -e "
          const fs = require('fs');
          const cfg = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8'));
          cfg.server.url = process.env.SERVER_URL;
          fs.writeFileSync('capacitor.config.json', JSON.stringify(cfg, null, 2));
          console.log('server.url =', cfg.server.url);
          "
      - name: 同步安卓工程
        run: npx cap sync android
      - name: 构建 APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - name: 上传到「安装包下载」Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: installers
          name: 安装包下载
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: false
